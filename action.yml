name: Watchdog
description: AI code review and test-gap detection for pull requests, using Gemini (free tier) or Claude.
branding:
  icon: shield
  color: blue
inputs:
  task:
    description: What to run, "review" (AI code review) or "test-gap" (find changed functions with no test).
    default: review
  head-sha:
    description: Commit to comment on, when an earlier step pushed to the PR (defaults to the event's head commit).
    default: ""
  github-token:
    description: Token used to read the PR and post comments.
    default: ${{ github.token }}
  gemini-api-key:
    description: Google Gemini API key (free from aistudio.google.com). Used by default when set.
    required: false
  anthropic-api-key:
    description: Anthropic API key, to use Claude instead. Without any key, the review is skipped and test-gap runs rule checks only.
    required: false
  ai-provider:
    description: Which AI to use, "auto" (Gemini if its key is set, else Claude), "gemini" or "anthropic".
    default: auto
  model:
    description: Model override. Defaults to gemini-3.8-flash for Gemini and claude-opus-5-5 for Claude.
    default: ""
  ignore-paths:
    description: Glob patterns to skip, one per line or comma-separated.
    default: ""
  lint-results:
    description: "[review] Directory with the lint job's results (summary.tsv and logs), passed to the reviewer."
    default: ""
  min-severity:
    description: "[review] Lowest severity posted as an inline comment: critical, major, minor, nit, or none."
    default: minor
  max-comments:
    description: "[review] Maximum inline comments per run. The most severe are kept."
    default: "15"
  max-review-chars:
    description: "[review] Characters of diff and file content put directly in the prompt; files beyond it are read through tools. Default depends on the provider."
    default: ""
  max-iterations:
    description: "[review] Maximum API round trips while the model explores the repository. Default depends on the provider."
    default: ""
  fail-on-severity:
    description: "[review] Fail the check when a finding at this severity or worse exists (critical, major, minor, nit), or none."
    default: none
  verify-findings:
    description: "[review] Prove suspected bugs by writing and running a test for each. Needs the project's dependencies installed."
    default: "true"
  max-proofs:
    description: "[review] Maximum findings to prove per run."
    default: "5"
  test-timeout:
    description: Seconds allowed for one test run (proofs and mutation checks).
    default: "120"
  mutation-testing:
    description: "[test-gap] Break changed lines on purpose and check the tests notice. Needs the project's dependencies installed."
    default: "true"
  max-mutants:
    description: "[test-gap] Maximum deliberate breaks to try per run."
    default: "30"
  mutation-budget:
    description: "[test-gap] Total seconds for the mutation check."
    default: "600"
  fail-on:
    description: "[test-gap] Fail the check on gaps at this risk or higher (low, medium, high), or none."
    default: none
  max-functions:
    description: "[test-gap] Maximum number of changed functions checked per PR."
    default: "40"
outputs:
  score:
    description: "[review] Merge-readiness score from 1 to 10."
  findings:
    description: "[review] Number of findings."
  gaps:
    description: "[test-gap] Number of changed functions that look untested."
runs:
  using: node24
  main: dist/index.cjs
