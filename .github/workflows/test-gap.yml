name: Test gap finder

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: test-gap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-gap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # In another repo, use: uses: <your-github-user>/watchdog@v1
      - uses: ./
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          fail-on: none
